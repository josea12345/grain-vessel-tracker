name: Collect vessel positions

on:
  schedule:
    - cron: "15 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - run: python collector/collector.py --seconds 180
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - name: Commit fresh snapshot
        run: |
          git config user.name "vessel-bot"
          git config user.email "vessel-bot@users.noreply.github.com"
          git add data/vessels.json data/vessels.db
          git diff --quiet --cached || git commit -m "vessel snapshot $(date -u +%F-%H%M)"
          git push
